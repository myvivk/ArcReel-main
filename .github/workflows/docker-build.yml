name: Build and Push Docker Image

on:
  workflow_dispatch:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# 默认权限收紧；只有真正推送的 job 临时需要 registry 写权限
permissions:
  contents: read

jobs:
  # ----------------------------------------------------------
  # Step 1: 构建前端，产物作为 artifact
  # ----------------------------------------------------------
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        run: pnpm build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

  # ----------------------------------------------------------
  # Step 2: 拉取代码，打包为 artifact 供下游使用（排除 .git 和 node_modules）
  # ----------------------------------------------------------
  checkout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create source archive
        run: tar -czf /tmp/repo.tar.gz --exclude=.git --exclude=node_modules --exclude=frontend/node_modules .

      - name: Upload repo archive
        uses: actions/upload-artifact@v4
        with:
          name: repo
          path: /tmp/repo.tar.gz
          if-no-files-found: error

  # ----------------------------------------------------------
  # Step 3: 合并 repo + 前端产物为统一构建上下文 artifact
  # ----------------------------------------------------------
  download:
    needs: [ frontend, checkout ]
    runs-on: ubuntu-latest
    steps:
      - name: Download repo archive
        uses: actions/download-artifact@v4
        with:
          name: repo

      - name: Extract repo
        run: mkdir -p build-context && tar -xzf repo.tar.gz -C build-context

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: build-context/frontend/dist

      - name: Upload build context
        uses: actions/upload-artifact@v4
        with:
          name: build-context
          path: build-context

  # ----------------------------------------------------------
  # Step 4: 计算镜像标签 / 元数据，作为 outputs 传给 build-push
  # ----------------------------------------------------------
  metadata:
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
    steps:
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: 15200944233/arcreel
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

  # ----------------------------------------------------------
  # Step 7: 计算 weekly apt refresh token，作为 output 传给 build-push
  # ----------------------------------------------------------
  apt:
    runs-on: ubuntu-latest
    outputs:
      token: ${{ steps.apt.outputs.token }}
    steps:
      - name: Compute weekly apt refresh token
        id: apt
        run: echo "token=$(date +%G-W%V)" >> "$GITHUB_OUTPUT"

  # ----------------------------------------------------------
  # Step 6: 构建并推送（聚合所有上游；自身完成 buildx/login）
  # ----------------------------------------------------------
  build-push:
    needs: [ download, metadata, apt ]
    runs-on: ubuntu-latest
    steps:
      - name: Download build context
        uses: actions/download-artifact@v4
        with:
          name: build-context
          path: .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ needs.metadata.outputs.tags }}
          labels: ${{ needs.metadata.outputs.labels }}
          build-args: |
            APT_REFRESH=${{ needs.apt.outputs.token }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
