services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: arcreel
      POSTGRES_DB: arcreel
      POSTGRES_PASSWORD: a3f1c9e2b7d84f0a6c5e1b2d9f3a7c48
    volumes:
      - /opt/arcreel/pgdata:/var/lib/postgresql
    # ... 其他配置保持不变

  arcreel:
    image: 15200944233/arcreel:latest
    ports:
      - "1241:1241"
    command: /app/.venv/bin/uvicorn server.app:app --host 0.0.0.0 --port 1241
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://arcreel:${POSTGRES_PASSWORD}@postgres:5432/arcreel
      TZ: ${TZ:-Asia/Shanghai}
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    cap_add:
      - NET_ADMIN
    volumes:
      - ./.env:/app/.env
      - ./projects:/app/projects
      - ./claude_data:/root/.claude
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1241/health"]
      interval: 30s
      timeout: 5s
      retries: 3